
services:
  backend:
    build:
      context: .
      dockerfile: backend/dev.Dockerfile
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      PORT: "8001"

  frontend:
    build:
      context: .
      dockerfile: frontend/dev.Dockerfile
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      NODE_OPTIONS: --openssl-legacy-provider

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "8082:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
